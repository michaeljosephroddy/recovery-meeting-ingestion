[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery-meeting-ingestion"
version = "0.1.0"
description = "Recovery meeting discovery, ingestion, review, and snapshot export service for SoberSpace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "selectolax>=0.3.21",
    "soupsieve>=2.0",
    "structlog>=24.2",
    "tenacity>=8.5",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
geocoding = []
pdf = ["pypdf>=4.3"]
playwright = ["playwright>=1.45"]

[project.scripts]
recovery-meeting-ingestion = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: tests that require a local Postgres ingestion database",
    "live: tests that fetch configured live recovery meeting sources",
]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = true
warn_unused_ignores = true
